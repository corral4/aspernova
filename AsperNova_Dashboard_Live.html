<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero Ejecutivo de Obras — AsperNova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F4F3; --panel:#FFFFFF; --ink:#16232B; --ink-muted:#5C6B72;
    --line:#CBD4D2; --line-strong:#8CA0A0;
    --steel:#2C5F7C; --steel-soft:#DCE6EA;
    --sage:#3F7864; --sage-soft:#E1EDE7;
    --ember:#B3492D; --ember-soft:#F4E1DB;
    --amber:#B98A2E; --amber-soft:#F2E9D6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line-strong);}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px 0;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;}
  .brand h1{font-size:19px;font-weight:600;}
  .brand .sub{color:var(--ink-muted);font-size:12px;display:flex;align-items:center;gap:10px;}
  #refreshBtn{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line-strong);background:var(--panel);padding:3px 9px;cursor:pointer;color:var(--steel);}
  #refreshBtn:hover{background:var(--steel-soft);}
  nav.sheets{display:flex;gap:2px;overflow-x:auto;margin-top:12px;}
  nav.sheets button{
    font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--ink-muted);
    background:transparent;border:1px solid var(--line);border-bottom:none;padding:9px 16px;
    cursor:pointer;white-space:nowrap;border-radius:3px 3px 0 0;position:relative;top:1px;
  }
  nav.sheets button .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--line-strong);margin-right:7px;}
  nav.sheets button.active{color:var(--ink);background:var(--panel);border-color:var(--line-strong);border-bottom:1px solid var(--panel);}

  main{max-width:1180px;margin:0 auto;padding:18px 20px 60px;}
  .sheet{display:none;}
  .sheet.active{display:block;}
  .page-head{margin-bottom:14px;}
  .page-head h2{font-size:20px;font-weight:600;}
  .page-head p{color:var(--ink-muted);font-size:13px;margin-top:4px;max-width:74ch;}

  .filtro-row{margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .filtro-row label{font-size:12px;color:var(--ink-muted);}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:880px){.grid,.grid.cols-3,.grid.cols-2{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.grid,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--line-strong);padding:14px 16px;}
  .panel.span-2{grid-column:span 2;}
  .panel.span-4{grid-column:1/-1;}

  .kpi .label{font-size:11.5px;color:var(--ink-muted);}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-top:4px;}
  .kpi .note{font-size:11.5px;color:var(--ink-muted);margin-top:6px;line-height:1.4;}
  .tag{display:inline-block;font-size:10px;font-family:'IBM Plex Mono',monospace;border:1px solid;padding:1px 6px;margin-top:8px;}
  .tag.alerta{color:var(--ember);border-color:var(--ember);background:var(--ember-soft);}
  .tag.ok{color:var(--sage);border-color:var(--sage);background:var(--sage-soft);}

  h3.panel-title{font-size:13.5px;font-weight:600;margin-bottom:2px;}
  .panel-sub{font-size:11.5px;color:var(--ink-muted);margin-bottom:10px;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{text-align:left;padding:6px 7px;border-bottom:1px solid var(--line);}
  th{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:11px;color:var(--ink-muted);border-bottom:1px solid var(--line-strong);cursor:default;}
  td.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
  tr.alerta td{background:var(--ember-soft);}
  .tablewrap{overflow-x:auto;}

  .callout{border-left:3px solid var(--amber);background:var(--amber-soft);padding:9px 12px;font-size:12px;margin-top:10px;}
  .callout.ember{border-left-color:var(--ember);background:var(--ember-soft);}

  .divrow{display:grid;grid-template-columns:200px 1fr 110px;align-items:center;gap:8px;margin-bottom:7px;}
  .divrow .lbl{font-size:11.5px;}
  .divtrack{position:relative;height:14px;background:var(--line);}
  .divtrack .zero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-strong);}
  .divtrack .bar{position:absolute;top:0;height:100%;}
  .divtrack .bar.pos{background:var(--sage);left:50%;}
  .divtrack .bar.neg{background:var(--ember);right:50%;}
  .divrow .val{font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:right;}

  .barlist .row{display:grid;grid-template-columns:190px 1fr 100px;align-items:center;gap:8px;margin-bottom:7px;}
  .barlist .lbl{font-size:11.5px;}
  .barlist .track{background:var(--line);height:13px;position:relative;}
  .barlist .fill{background:var(--steel);height:100%;}
  .barlist .val{font-family:'IBM Plex Mono',monospace;font-size:11px;text-align:right;}

  select, .selectbox{font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;border:1px solid var(--line-strong);padding:6px 10px;background:var(--panel);color:var(--ink);}

  .miniprog{width:70px;height:8px;background:var(--line);position:relative;display:inline-block;vertical-align:middle;margin-right:6px;}
  .miniprog .fill{position:absolute;left:0;top:0;height:100%;background:var(--sage);}

  .heatgrid table{border-collapse:separate;border-spacing:3px;}
  .heatgrid th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:500;color:var(--ink-muted);border-bottom:none;padding:2px;text-align:center;}
  td.day{padding:0;border:none;text-align:center;}
  .box{width:14px;height:14px;display:inline-block;}
  .box.ok{background:var(--sage);}
  .box.miss{background:var(--panel);border:1px solid var(--ember);}

  #loading, #errorbox{max-width:1180px;margin:60px auto;padding:0 20px;text-align:center;color:var(--ink-muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  #errorbox{color:var(--ember);display:none;}

  footer{max-width:1180px;margin:0 auto;padding:20px 20px 40px;color:var(--ink-muted);font-size:11px;}
</style>
</head>
<body>

<div id="loading">Cargando datos en vivo del portafolio…</div>
<div id="errorbox"></div>

<div id="app" style="display:none;">
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Tablero Ejecutivo de Obras</h1>
      <span class="sub">AsperNova · <span id="ultimaActualizacion">—</span> <button id="refreshBtn">↻ actualizar</button></span>
    </div>
    <nav class="sheets" id="nav">
      <button data-page="p1" class="active"><span class="n">01</span>Resumen</button>
      <button data-page="p2"><span class="n">02</span>Rentabilidad</button>
      <button data-page="p3"><span class="n">03</span>Gasto</button>
      <button data-page="p4"><span class="n">04</span>Nómina</button>
      <button data-page="p5"><span class="n">05</span>PPTO vs Real</button>
      <button data-page="p6"><span class="n">06</span>Captura diaria</button>
    </nav>
  </div>
</div>

<main>
  <section id="p1" class="sheet active"></section>
  <section id="p2" class="sheet"></section>
  <section id="p3" class="sheet"></section>
  <section id="p4" class="sheet"></section>
  <section id="p5" class="sheet"></section>
  <section id="p6" class="sheet"></section>
</main>

<footer>Datos en vivo desde Google Sheets vía Apps Script · el respaldo se recalcula cada ~30 min · este documento no sustituye la revisión con el equipo de obra antes de decisiones de financiamiento.</footer>
</div>

<script>
// ============ CONFIG ============
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwD_qXXjYenWoe0DWpEG_EZbxOr5nunyy0yE0kgd14Yd7sGBPG_E_sfQVoDviUKZ4w/exec';

const fmtMoney = new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:0});
const fmtPct = (x) => (x===null || x===undefined) ? '—' : (x*100).toFixed(1)+'%';
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA = null;

// ============ CARGA DE DATOS ============
// Confirmado: el endpoint responde con Access-Control-Allow-Origin: *, así que
// un fetch() directo funciona sin rodeos (no hace falta JSONP).
function cargarDatos(){
  const controller = new AbortController();
  const to = setTimeout(() => controller.abort(), 15000);
  return fetch(ENDPOINT, {signal: controller.signal})
    .then(r => {
      clearTimeout(to);
      if(!r.ok) throw new Error('El endpoint respondió con estado ' + r.status);
      return r.json();
    })
    .catch(err => {
      clearTimeout(to);
      if(err.name === 'AbortError') throw new Error('Tiempo de espera agotado (15s). ¿El deployment sigue activo?');
      throw err;
    });
}

async function iniciar(){
  document.getElementById('loading').style.display = 'block';
  document.getElementById('errorbox').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  try{
    DATA = await cargarDatos();
    if(DATA.error){ throw new Error(DATA.error); }
    renderTodo();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }catch(err){
    document.getElementById('loading').style.display = 'none';
    const box = document.getElementById('errorbox');
    box.style.display = 'block';
    box.textContent = 'No se pudo cargar el tablero: ' + err.message;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  iniciar();
  document.body.addEventListener('click', (e) => {
    if(e.target.id === 'refreshBtn') iniciar();
    const navBtn = e.target.closest('nav.sheets button');
    if(navBtn){
      document.querySelectorAll('nav.sheets button').forEach(b=>b.classList.remove('active'));
      navBtn.classList.add('active');
      const target = navBtn.getAttribute('data-page');
      document.querySelectorAll('.sheet').forEach(s=>s.classList.toggle('active', s.id===target));
      window.scrollTo({top:0, behavior:'smooth'});
    }
  });
  document.body.addEventListener('change', (e) => {
    if(e.target.id === 'filtroObraConceptos') renderConceptosTabla(e.target.value);
    if(e.target.id === 'filtroObraResumen') renderResumen(e.target.value);
    if(e.target.id === 'filtroObraGasto') renderGasto(e.target.value);
  });
});

function renderTodo(){
  const gen = new Date(DATA.generado);
  document.getElementById('ultimaActualizacion').textContent = 'última actualización: ' + gen.toLocaleString('es-MX');
  renderResumen();
  renderRentabilidad();
  renderGasto();
  renderNomina();
  renderConceptosPagina();
  renderCapturaDiaria();
}

// ============ 01 RESUMEN ============
function renderResumen(obraId){
  obraId = obraId || '';
  const obras = DATA.obras || [];
  const r = DATA.resumen || {};

  const opciones = ['<option value="">Todo el portafolio</option>']
    .concat(obras.map(o=>`<option value="${esc(o.id_obra)}" ${o.id_obra===obraId?'selected':''}>${esc(o.nombre_obra)}</option>`))
    .join('');

  let bodyHtml;
  if(!obraId){
    const activas = obras.filter(o => o.estado === 'ACTIVA');
    const margenNeg = obras.filter(o => o.margen_contrato < 0);
    const sobrefacturadas = obras.filter(o => o.pct_facturado_contrato != null && o.pct_facturado_contrato > 1);
    bodyHtml = `
      <div class="grid">
        <div class="panel kpi"><div class="label">Monto contratado (portafolio)</div><div class="value">${fmtMoney.format(r.monto_contrato_total||0)}</div><div class="note">${obras.length} obras registradas, ${activas.length} activas.</div></div>
        <div class="panel kpi"><div class="label">Compra real acumulada</div><div class="value">${fmtMoney.format(r.compra_real_total||0)}</div><div class="note">Material comprado, todo el portafolio.</div></div>
        <div class="panel kpi"><div class="label">Facturado real acumulado</div><div class="value">${fmtMoney.format(r.facturado_real_total||0)}</div><div class="note">${fmtPct((r.facturado_real_total||0)/(r.monto_contrato_total||1))} del monto contratado.</div></div>
        <div class="panel kpi"><div class="label">Margen a contrato (portafolio)</div><div class="value">${fmtMoney.format(r.margen_contrato_total||0)}</div><div class="note">Monto Total Contrato − Compra real − Nómina prorrateada.</div></div>
      </div>
      <div class="grid cols-2" style="margin-top:11px;">
        <div class="panel kpi"><div class="label">Obras con margen a contrato negativo</div><div class="value">${margenNeg.length}</div><div class="note">${margenNeg.map(o=>esc(o.nombre_obra)).join(', ') || 'ninguna'}</div>${margenNeg.length? '<span class="tag alerta">revisar</span>':'<span class="tag ok">sin alerta</span>'}</div>
        <div class="panel kpi"><div class="label">Obras facturadas sobre el 100% del contrato</div><div class="value">${sobrefacturadas.length}</div><div class="note">${sobrefacturadas.map(o=>esc(o.nombre_obra)).join(', ') || 'ninguna'}</div>${sobrefacturadas.length? '<span class="tag alerta">revisar</span>':'<span class="tag ok">sin alerta</span>'}</div>
      </div>
      <div class="panel span-4" style="margin-top:11px;">
        <h3 class="panel-title">Margen a contrato, por obra</h3>
        <div class="panel-sub">Monto Total Contrato − Compra real − Nómina prorrateada. Verde = margen positivo, rojo = obra que ya cuesta más de lo que vale su contrato completo.</div>
        <div id="chartMargen"></div>
      </div>
      <div class="callout">La mayoría de las obras del portafolio son de reciente arranque y todavía no tienen avances capturados en <span class="mono">3_Avances_Diarios</span> — por eso el avance devengado no aparece de forma general todavía; se irá poblando obra por obra conforme haya captura.</div>
    `;
  } else {
    const o = obras.find(x=>x.id_obra===obraId);
    if(!o){ bodyHtml = '<div class="panel">No se encontró esa obra.</div>'; }
    else {
      bodyHtml = `
        <div class="grid">
          <div class="panel kpi"><div class="label">Monto contratado</div><div class="value">${fmtMoney.format(o.monto_contrato)}</div><div class="note">${esc(o.cliente)} · OT ${esc(o.ot)} · ${esc(o.estado)}</div></div>
          <div class="panel kpi"><div class="label">Compra real</div><div class="value">${fmtMoney.format(o.compra_real)}</div></div>
          <div class="panel kpi"><div class="label">Facturado real</div><div class="value">${fmtMoney.format(o.facturado_real)}</div><div class="note">${fmtPct(o.pct_facturado_contrato)} del contrato.</div></div>
          <div class="panel kpi"><div class="label">Nómina prorrateada acumulada</div><div class="value">${fmtMoney.format(o.nomina_prorrateada_acumulada)}</div></div>
        </div>
        <div class="grid cols-2" style="margin-top:11px;">
          <div class="panel kpi"><div class="label">Margen a contrato</div><div class="value">${fmtMoney.format(o.margen_contrato)}</div>${o.margen_contrato<0?'<span class="tag alerta">revisar</span>':'<span class="tag ok">sin alerta</span>'}</div>
          <div class="panel kpi"><div class="label">Avance devengado</div><div class="value">${o.ingreso_devengado>0?fmtMoney.format(o.ingreso_devengado):'—'}</div><div class="note">${o.ingreso_devengado>0? 'Margen devengado: '+fmtMoney.format(o.margen_devengado) : 'Sin avances capturados todavía en esta obra.'}</div></div>
        </div>
      `;
    }
  }

  document.getElementById('p1').innerHTML = `
    <div class="page-head">
      <h2>Resumen ejecutivo del portafolio</h2>
      <p>Lectura de 30 segundos, con datos en vivo de Compras, Ventas, Nómina y Obras.</p>
    </div>
    <div class="filtro-row"><label>Ver: </label><select id="filtroObraResumen">${opciones}</select></div>
    ${bodyHtml}
  `;

  if(!obraId){
    const maxAbs = Math.max(1, ...obras.map(o => Math.abs(o.margen_contrato||0)));
    const ordenado = [...obras].sort((a,b)=> (a.margen_contrato||0)-(b.margen_contrato||0));
    const chart = document.getElementById('chartMargen');
    chart.innerHTML = ordenado.map(o=>{
      const v = o.margen_contrato||0;
      const pctWidth = Math.min(50, Math.abs(v)/maxAbs*50);
      const barHtml = v>=0
        ? `<div class="bar pos" style="width:${pctWidth}%;"></div>`
        : `<div class="bar neg" style="width:${pctWidth}%;"></div>`;
      return `<div class="divrow"><div class="lbl">${esc(o.nombre_obra)}</div><div class="divtrack"><div class="zero"></div>${barHtml}</div><div class="val">${fmtMoney.format(v)}</div></div>`;
    }).join('');
  }
}

// ============ 02 RENTABILIDAD ============
function renderRentabilidad(){
  const obras = [...(DATA.obras||[])].sort((a,b)=>(a.margen_contrato||0)-(b.margen_contrato||0));
  let filas = obras.map(o=>{
    const alerta = o.margen_contrato < 0;
    const posTxt = (o.ingreso_devengado>0 && o.posicion_facturacion!=null)
      ? fmtPct(o.posicion_facturacion)
      : '—';
    return `<tr class="${alerta?'alerta':''}">
      <td>${esc(o.nombre_obra)}</td>
      <td class="num">${fmtMoney.format(o.monto_contrato)}</td>
      <td class="num">${fmtMoney.format(o.compra_real)}</td>
      <td class="num">${fmtPct(o.pct_facturado_contrato)}</td>
      <td class="num">${fmtMoney.format(o.margen_contrato)}</td>
      <td class="num">${fmtMoney.format(o.nomina_prorrateada_acumulada)}</td>
      <td class="num">${posTxt}</td>
      <td>${o.estado}</td>
    </tr>`;
  }).join('');

  document.getElementById('p2').innerHTML = `
    <div class="page-head">
      <h2>Rentabilidad por obra</h2>
      <p>Ordenado del margen más bajo al más alto, para que lo que necesita atención aparezca arriba.</p>
    </div>
    <div class="panel span-4">
      <div class="tablewrap"><table>
        <thead><tr><th>Obra</th><th>Contrato</th><th>Compra real</th><th>% Facturado</th><th>Margen a contrato</th><th>Nómina prorrateada</th><th>Posición facturación</th><th>Estado</th></tr></thead>
        <tbody>${filas}</tbody>
      </table></div>
      <div class="callout">
        <b>Nómina prorrateada</b>: lo que le toca a esta obra de la nómina total de la empresa, mes con mes, a prorrata de su Monto Total Contrato entre las obras activas ese mes — es exactamente lo que ya se resta en "Margen a contrato".<br><br>
        <b>Posición de facturación</b> compara qué tanto has facturado contra qué tanto has ejecutado, ambos como % del contrato. Ejemplo: 60% facturado contra 40% de avance devengado da +20% — facturaste por delante de tu propio avance (riesgo si el cliente audita contra obra ejecutada). Si fuera −20%, ya ejecutaste más de lo que has cobrado. Sale "—" en casi todas las obras porque casi ninguna tiene avances capturados en 3_Avances_Diarios todavía; se va llenando con la captura.
      </div>
    </div>
  `;
}

// ============ 03 DETALLE DE GASTO ============
function agruparSuma_(arr, keyField){
  const m = new Map();
  arr.forEach(item=>{
    const k = item[keyField];
    m.set(k, (m.get(k)||0) + (item.monto||0));
  });
  return [...m.entries()].map(([k,monto])=>({ [keyField]: k, monto }));
}

function renderGasto(obraId){
  obraId = obraId || '';
  const rowsCat = DATA.gasto_por_categoria || [];
  const rowsProv = DATA.gasto_por_proveedor || [];
  const rowsSC = DATA.gasto_sin_clasificar || [];

  const obrasConGasto = [...new Map(rowsCat.filter(r=>r.id_obra).map(c=>[c.id_obra, c.nombre_obra])).entries()];
  const opciones = ['<option value="">Todo el portafolio</option>']
    .concat(obrasConGasto.map(([id,nombre])=>`<option value="${esc(id)}" ${id===obraId?'selected':''}>${esc(nombre)}</option>`))
    .join('');

  let cats, provs, sc;
  if(obraId){
    cats = rowsCat.filter(r=>r.id_obra===obraId);
    provs = rowsProv.filter(r=>r.id_obra===obraId);
    sc = rowsSC.filter(r=>r.id_obra===obraId);
  } else {
    cats = agruparSuma_(rowsCat, 'categoria');
    provs = agruparSuma_(rowsProv, 'proveedor');
    sc = rowsSC;
  }
  cats.sort((a,b)=>b.monto-a.monto);
  provs.sort((a,b)=>b.monto-a.monto);
  sc = [...sc].sort((a,b)=>b.monto-a.monto);

  const total = cats.reduce((s,c)=>s+c.monto,0);
  const maxCat = Math.max(1, ...cats.map(c=>c.monto));
  const filasCat = cats.map(c=>`
    <div class="row"><div class="lbl">${esc(c.categoria)}</div><div class="track"><div class="fill" style="width:${(c.monto/maxCat*100).toFixed(1)}%"></div></div><div class="val">${fmtMoney.format(c.monto)}</div></div>
  `).join('');

  const maxProv = Math.max(1, ...provs.map(p=>p.monto));
  const filasProv = provs.map(p=>`
    <div class="row"><div class="lbl">${esc(p.proveedor)}</div><div class="track"><div class="fill" style="width:${(p.monto/maxProv*100).toFixed(1)}%"></div></div><div class="val">${fmtMoney.format(p.monto)}</div></div>
  `).join('');

  const filasSC = sc.map(s=>`
    <tr><td>${esc(s.nombre_obra||'')}</td><td>${esc(s.codigo_producto)}</td><td>${esc(s.nombre_producto)}</td><td class="num">${s.unidades}</td><td class="num">${fmtMoney.format(s.monto)}</td></tr>
  `).join('');
  const totalSC = sc.reduce((s,x)=>s+x.monto,0);

  document.getElementById('p3').innerHTML = `
    <div class="page-head">
      <h2>Detalle de gasto en materiales</h2>
      <p>En qué se está gastando el dinero de compras: por categoría de producto y por proveedor.</p>
    </div>
    <div class="filtro-row"><label>Obra: </label><select id="filtroObraGasto">${opciones}</select></div>
    <div class="grid cols-2">
      <div class="panel kpi"><div class="label">Gasto total en material</div><div class="value">${fmtMoney.format(total)}</div><div class="note">${cats.length} categorías distintas.</div></div>
      <div class="panel kpi"><div class="label">Categoría con mayor peso</div><div class="value">${cats[0]?esc(cats[0].categoria):'—'}</div><div class="note">${cats[0]?fmtMoney.format(cats[0].monto)+' · '+fmtPct(cats[0].monto/(total||1)):''}</div></div>
    </div>
    <div class="grid cols-2" style="margin-top:11px;">
      <div class="panel">
        <h3 class="panel-title">Gasto por categoría de material</h3>
        <div class="panel-sub">Según la clasificación de CAT_PROD, por código de producto.</div>
        <div class="barlist">${filasCat || '<div class="panel-sub">Sin compras registradas para esta selección.</div>'}</div>
      </div>
      <div class="panel">
        <h3 class="panel-title">Compras por proveedor</h3>
        <div class="barlist">${filasProv || '<div class="panel-sub">Sin compras registradas para esta selección.</div>'}</div>
      </div>
    </div>
    <div class="panel span-4" style="margin-top:11px;">
      <h3 class="panel-title">Detalle de "Sin clasificar" (${fmtMoney.format(totalSC)})</h3>
      <div class="panel-sub">"Sin clasificar" = compras cuyo Código Producto no aparece todavía en tu hoja CAT_PROD. Agrega estos códigos ahí (con su Clasificación Producto 1) para que dejen de salir aquí.</div>
      <div class="tablewrap"><table>
        <thead><tr><th>Obra</th><th>Código</th><th>Producto</th><th>Unidades</th><th>Monto</th></tr></thead>
        <tbody>${filasSC || '<tr><td colspan="5">Nada sin clasificar en esta selección — buen trabajo.</td></tr>'}</tbody>
      </table></div>
    </div>
  `;
}

// ============ 04 NÓMINA ============
function renderNomina(){
  const meses = [...(DATA.nomina_por_mes||[])].sort((a,b)=> a.mes<b.mes?1:-1);
  const filasMeses = meses.map(m=>`<tr class="${m.baja_confianza?'alerta':''}"><td>${m.mes}</td><td class="num">${fmtMoney.format(m.nomina_total)}</td><td class="num">${m.obras_activas}</td><td>${m.baja_confianza?'⚠ pocas obras activas — revisar':''}</td></tr>`).join('');
  const ultimo = meses[0];
  const filasDetalle = ultimo ? ultimo.detalle.map(d=>`<tr><td>${esc(d.nombre_obra)}</td><td class="num">${fmtMoney.format(d.monto_prorrateado)}</td></tr>`).join('') : '';

  document.getElementById('p4').innerHTML = `
    <div class="page-head">
      <h2>Nómina y prorrateo por obra</h2>
      <p>La nómina de cada mes se reparte entre las obras que estuvieron activas ese mes, a prorrata de su Monto Total Contrato.</p>
    </div>
    <div class="grid cols-2">
      <div class="panel">
        <h3 class="panel-title">Nómina total por mes</h3>
        <div class="tablewrap"><table><thead><tr><th>Mes</th><th>Nómina total</th><th>Obras activas</th><th></th></tr></thead><tbody>${filasMeses}</tbody></table></div>
        <div class="callout">Meses marcados en rojo tuvieron 2 obras activas o menos según fechas — si esos meses son anteriores a que 1_Obras tuviera el roster completo, su prorrateo probablemente está inflado en las pocas obras que sí aparecen.</div>
      </div>
      <div class="panel">
        <h3 class="panel-title">Prorrateo del mes más reciente${ultimo? ' ('+ultimo.mes+')':''}</h3>
        <div class="tablewrap"><table><thead><tr><th>Obra</th><th>Nómina prorrateada</th></tr></thead><tbody>${filasDetalle}</tbody></table></div>
      </div>
    </div>
  `;
}

// ============ 05 PPTO VS REAL POR CONCEPTO ============
function renderConceptosPagina(){
  const conceptos = DATA.conceptos||[];
  const obrasUnicas = [...new Map(conceptos.map(c=>[c.id_obra, c.nombre_obra])).entries()];
  const opciones = obrasUnicas.map(([id,nombre])=>`<option value="${esc(id)}">${esc(nombre)}</option>`).join('');

  document.getElementById('p5').innerHTML = `
    <div class="page-head">
      <h2>PPTO vs. Real por concepto</h2>
      <p>Cantidad contratada contra cantidad ejecutada, costo real y margen devengado — concepto por concepto.</p>
    </div>
    <div class="panel span-4">
      <div class="filtro-row"><label>Obra: </label><select id="filtroObraConceptos">${opciones}</select></div>
      <div id="tablaConceptos"></div>
      <div class="callout">"Costo real" y "Margen devengado" salen de cruzar el material que se usó en cada avance (columna Descripcion Material de 3_Avances_Diarios) contra lo comprado de ese material en esa misma obra. Si un concepto no tiene ningún avance capturado todavía, estas columnas quedan en blanco — no en cero, para no confundir "sin dato" con "sin costo".</div>
    </div>
  `;
  if(obrasUnicas.length) renderConceptosTabla(obrasUnicas[0][0]);
}

function renderConceptosTabla(idObra){
  const conceptos = (DATA.conceptos||[]).filter(c=>c.id_obra===idObra);
  const filas = conceptos.map(c=>{
    const pct = c.pct_avance==null?0:c.pct_avance;
    const costoTxt = c.costo_real_concepto==null ? '—' : fmtMoney.format(c.costo_real_concepto);
    const margenTxt = c.margen_devengado_concepto==null ? '—' : fmtMoney.format(c.margen_devengado_concepto);
    const mats = c.materiales_cargados || [];
    let materialesCelda;
    if(!mats.length){
      materialesCelda = '<span style="color:var(--ink-muted);font-size:11px;">sin material ligado</span>';
    } else {
      const filasMat = mats.map(m=>`
        <tr><td>${esc(m.material)}</td><td class="num">${m.unidades}</td><td class="num">${fmtMoney.format(m.costo_unitario)}</td><td class="num">${fmtMoney.format(m.monto_costo)}</td></tr>
      `).join('');
      materialesCelda = `
        <details>
          <summary style="cursor:pointer;color:var(--steel);font-size:11px;font-family:'IBM Plex Mono',monospace;">+ ${mats.length} material${mats.length!==1?'es':''}</summary>
          <div style="margin-top:6px;">
            <table style="font-size:10.5px;min-width:260px;">
              <thead><tr><th>Material</th><th>Cant. registrada*</th><th>Costo unit.</th><th>Monto</th></tr></thead>
              <tbody>${filasMat}</tbody>
            </table>
          </div>
        </details>`;
    }
    return `<tr>
      <td>${esc(c.clave)}</td>
      <td>${esc(c.descripcion)}</td>
      <td>${esc(c.unidad)}</td>
      <td class="num">${c.cantidad_contratada}</td>
      <td class="num">${c.cantidad_ejecutada_acumulada}</td>
      <td><span class="miniprog"><span class="fill" style="width:${Math.min(100,pct*100)}%"></span></span>${fmtPct(c.pct_avance)}</td>
      <td class="num">${fmtMoney.format(c.monto_contrato_concepto)}</td>
      <td class="num">${fmtMoney.format(c.monto_devengado_concepto)}</td>
      <td class="num">${costoTxt}</td>
      <td class="num">${margenTxt}</td>
      <td style="min-width:150px;">${materialesCelda}</td>
    </tr>`;
  }).join('');
  document.getElementById('tablaConceptos').innerHTML = `
    <div class="tablewrap"><table>
      <thead><tr><th>Clave</th><th>Descripción</th><th>Unidad</th><th>Cant. contratada</th><th>Cant. ejecutada</th><th>% Avance</th><th>Monto contrato</th><th>Monto devengado</th><th>Costo real</th><th>Margen devengado</th><th>Materiales cargados</th></tr></thead>
      <tbody>${filas}</tbody>
    </table></div>
    <div class="panel-sub" style="margin-top:6px;">*Cant. registrada = Cantidad Ejecutada (día) tal como la captura el residente, en la unidad del <b>concepto</b> (columna "Unidad" de esta tabla) — no es una unidad física propia del material, porque el formulario de avances no la captura por separado hoy.</div>
  `;
}

// ============ 06 CAPTURA DIARIA ============
function renderCapturaDiaria(){
  const cd = DATA.captura_diaria || {dias:[], obras:[]};
  const hoy = new Date().toISOString().slice(0,10);
  const sinReporteHoy = cd.obras.filter(o=>!(o.dias_con_reporte||[]).includes(hoy));

  const headerDias = cd.dias.map(d=>`<th>${d.slice(8,10)}</th>`).join('');
  const filas = cd.obras.map(o=>{
    const set = new Set(o.dias_con_reporte||[]);
    const celdas = cd.dias.map(d=>{
      const ok = set.has(d);
      return `<td class="day"><span class="box ${ok?'ok':'miss'}" title="${d}${ok?' — con reporte':' — sin reporte'}"></span></td>`;
    }).join('');
    return `<tr><td>${esc(o.nombre_obra)}</td><td>${esc(o.residente||'—')}</td>${celdas}</tr>`;
  }).join('');

  document.getElementById('p6').innerHTML = `
    <div class="page-head">
      <h2>Captura diaria por residente</h2>
      <p>Un cuadro verde significa que ese día se registró al menos un avance en 3_Avances_Diarios para esa obra. Últimos ${cd.dias.length} días, solo obras ACTIVA.</p>
    </div>
    <div class="grid cols-2">
      <div class="panel kpi"><div class="label">Obras sin reporte hoy</div><div class="value">${sinReporteHoy.length} de ${cd.obras.length}</div><div class="note">${sinReporteHoy.map(o=>esc(o.nombre_obra)).join(', ')||'todas reportaron hoy'}</div></div>
    </div>
    <div class="panel span-4 heatgrid" style="margin-top:11px;">
      <div class="tablewrap"><table>
        <thead><tr><th style="text-align:left;">Obra</th><th style="text-align:left;">Residente</th>${headerDias}</tr></thead>
        <tbody>${filas || '<tr><td colspan="2">Sin obras activas.</td></tr>'}</tbody>
      </table></div>
      <div style="margin-top:10px;display:flex;gap:14px;font-size:11px;color:var(--ink-muted);align-items:center;">
        <span><span class="box ok" style="vertical-align:middle;"></span> con reporte</span>
        <span><span class="box miss" style="vertical-align:middle;"></span> sin reporte</span>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
