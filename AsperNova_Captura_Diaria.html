<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captura Diaria — AsperNova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F4F3; --panel:#FFFFFF; --ink:#16232B; --ink-muted:#5C6B72;
    --line:#CBD4D2; --line-strong:#8CA0A0;
    --steel:#2C5F7C; --steel-soft:#DCE6EA;
    --sage:#3F7864; --sage-soft:#E1EDE7;
    --ember:#B3492D; --ember-soft:#F4E1DB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .topbar{border-bottom:1px solid var(--line-strong);background:var(--paper);}
  .topbar-inner{max-width:1000px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  .topbar h1{font-size:19px;font-weight:600;}
  .sub{color:var(--ink-muted);font-size:12px;display:flex;align-items:center;gap:10px;}
  #refreshBtn{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line-strong);background:var(--panel);padding:3px 9px;cursor:pointer;color:var(--steel);}
  #refreshBtn:hover{background:var(--steel-soft);}

  main{max-width:1000px;margin:0 auto;padding:18px 20px 50px;}
  .page-head p{color:var(--ink-muted);font-size:13px;margin-top:4px;max-width:70ch;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line-strong);padding:14px 16px;}
  .panel.span-2{grid-column:1/-1;}
  .kpi .label{font-size:11.5px;color:var(--ink-muted);}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;margin-top:4px;}
  .kpi .note{font-size:11.5px;color:var(--ink-muted);margin-top:6px;line-height:1.4;}

  table{width:100%;border-collapse:separate;border-spacing:3px;font-size:12px;}
  th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:500;color:var(--ink-muted);text-align:center;padding:2px;}
  th.txt{text-align:left;font-family:'Space Grotesk',sans-serif;font-size:11px;}
  td{padding:0;}
  td.txt{padding:6px 7px;font-size:12px;border-bottom:1px solid var(--line);}
  .tablewrap{overflow-x:auto;}
  .box{width:14px;height:14px;display:inline-block;}
  .box.ok{background:var(--sage);}
  .box.miss{background:var(--panel);border:1px solid var(--ember);}

  #loading, #errorbox{max-width:1000px;margin:60px auto;padding:0 20px;text-align:center;color:var(--ink-muted);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  #errorbox{color:var(--ember);display:none;}
  footer{max-width:1000px;margin:0 auto;padding:20px;color:var(--ink-muted);font-size:11px;}
</style>
</head>
<body>

<div id="loading">Cargando…</div>
<div id="errorbox"></div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="topbar-inner">
      <h1>Captura diaria por residente</h1>
      <span class="sub">AsperNova · <span id="ultimaActualizacion">—</span> <button id="refreshBtn">↻ actualizar</button></span>
    </div>
  </div>
  <main>
    <div class="page-head">
      <p>Un cuadro verde significa que ese día se registró al menos un avance de obra. Sólo obras activas.</p>
    </div>
    <div id="contenido"></div>
  </main>
  <footer>Vista restringida — sólo muestra estatus de captura, sin datos financieros.</footer>
</div>

<script>
// Este endpoint, con ?vista=captura_diaria, sólo devuelve { generado, captura_diaria } —
// nunca trae márgenes, compras, ni nómina, sin importar qué tan bien alguien inspeccione
// las peticiones de red desde esta página.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwD_qXXjYenWoe0DWpEG_EZbxOr5nunyy0yE0kgd14Yd7sGBPG_E_sfQVoDviUKZ4w/exec?vista=captura_diaria';

const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = null;

function cargarDatos(){
  const controller = new AbortController();
  const to = setTimeout(() => controller.abort(), 15000);
  return fetch(ENDPOINT, {signal: controller.signal})
    .then(r => { clearTimeout(to); if(!r.ok) throw new Error('El endpoint respondió con estado ' + r.status); return r.json(); })
    .catch(err => { clearTimeout(to); if(err.name === 'AbortError') throw new Error('Tiempo de espera agotado (15s).'); throw err; });
}

async function iniciar(){
  document.getElementById('loading').style.display = 'block';
  document.getElementById('errorbox').style.display = 'none';
  document.getElementById('app').style.display = 'none';
  try{
    DATA = await cargarDatos();
    if(DATA.error) throw new Error(DATA.error);
    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }catch(err){
    document.getElementById('loading').style.display = 'none';
    const box = document.getElementById('errorbox');
    box.style.display = 'block';
    box.textContent = 'No se pudo cargar: ' + err.message;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  iniciar();
  document.body.addEventListener('click', (e) => { if(e.target.id === 'refreshBtn') iniciar(); });
});

function render(){
  if(DATA.generado){
    document.getElementById('ultimaActualizacion').textContent = 'última actualización: ' + new Date(DATA.generado).toLocaleString('es-MX');
  }
  const cd = DATA.captura_diaria || {dias:[], obras:[]};
  const hoy = new Date().toISOString().slice(0,10);
  const sinReporteHoy = cd.obras.filter(o=>!(o.dias_con_reporte||[]).includes(hoy));

  const headerDias = cd.dias.map(d=>`<th>${d.slice(8,10)}</th>`).join('');
  const filas = cd.obras.map(o=>{
    const set = new Set(o.dias_con_reporte||[]);
    const celdas = cd.dias.map(d=>{
      const ok = set.has(d);
      return `<td class="day"><span class="box ${ok?'ok':'miss'}" title="${d}${ok?' — con reporte':' — sin reporte'}"></span></td>`;
    }).join('');
    return `<tr><td class="txt">${esc(o.nombre_obra)}</td><td class="txt">${esc(o.residente||'—')}</td>${celdas}</tr>`;
  }).join('');

  document.getElementById('contenido').innerHTML = `
    <div class="grid">
      <div class="panel kpi"><div class="label">Obras sin reporte hoy</div><div class="value">${sinReporteHoy.length} de ${cd.obras.length}</div><div class="note">${sinReporteHoy.map(o=>esc(o.nombre_obra)).join(', ')||'todas reportaron hoy'}</div></div>
    </div>
    <div class="panel span-2" style="margin-top:11px;">
      <div class="tablewrap"><table>
        <thead><tr><th class="txt">Obra</th><th class="txt">Residente</th>${headerDias}</tr></thead>
        <tbody>${filas || '<tr><td class="txt" colspan="2">Sin obras activas.</td></tr>'}</tbody>
      </table></div>
      <div style="margin-top:10px;display:flex;gap:14px;font-size:11px;color:var(--ink-muted);align-items:center;">
        <span><span class="box ok" style="vertical-align:middle;"></span> con reporte</span>
        <span><span class="box miss" style="vertical-align:middle;"></span> sin reporte</span>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
